[project]
name = "remote-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gyan Ranjan Panda", email = "gyanranjanpanda@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=4.0.3",
]

[project.scripts]
remote-mcp = "remote_mcp:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
